schema_version: "1.0"

extension:
  id: "gitlab"
  name: "spec-kit GitLab Integration"
  version: "1.1.0"
  description: "GitLab integration for spec-kit: create issues, sync, and post status updates via the glab CLI"
  category: "integration"
  effect: "read-write"
  author: "Kaio Lehartwig"
  repository: "https://github.com/ohartwig/spec-kit-gitlab"
  homepage: "https://github.com/ohartwig/spec-kit-gitlab"
  license: "MIT"

requires:
  # 0.12.17 is the first spec-kit release that rewrites extension-local
  # script paths and resolves __SPECKIT_COMMAND_*__ tokens in every
  # registerable layout (commands and skills).
  speckit_version: ">=0.12.17"
  tools:
    - name: "glab"
      version: ">=1.50.0"
      required: true
      description: "GitLab CLI used for issues, milestones, and API calls"
      install_url: "https://gitlab.com/gitlab-org/cli"
    - name: "jq"
      required: true
      description: "Parses JSON returned by the GitLab API"
      install_url: "https://jqlang.org/"
    - name: "bash"
      required: true
      description: "The helper script is written for bash"

provides:
  commands:
    - name: "speckit.gitlab.init"
      file: "commands/init.md"
      description: "Interactively set up the GitLab configuration"

    - name: "speckit.gitlab.tasks-to-issues"
      file: "commands/tasks-to-issues.md"
      description: "Create tasks from tasks.md as GitLab issues (Type: Task)"

    - name: "speckit.gitlab.stories-to-issues"
      file: "commands/stories-to-issues.md"
      description: "Create user stories from spec.md as GitLab issues"

    - name: "speckit.gitlab.feature-to-issue"
      file: "commands/feature-to-issue.md"
      description: "Create the feature as a GitLab issue and link stories"

    - name: "speckit.gitlab.import-feature"
      file: "commands/import-feature.md"
      description: "Import an existing GitLab issue as a feature"

    - name: "speckit.gitlab.close-issues"
      file: "commands/close-issues.md"
      description: "Close completed tasks/stories in GitLab, reopen reopened ones"

    - name: "speckit.gitlab.sync"
      file: "commands/sync.md"
      description: "Import/sync GitLab issues into spec-kit files"

    - name: "speckit.gitlab.status"
      file: "commands/status.md"
      description: "Show GitLab issue status and update tasks.md"

  config:
    - name: "gitlab-config.yml"
      template: "gitlab-config.template.yml"
      description: "GitLab server URL, project path, and label configuration"
      required: true

hooks:
  after_tasks:
    command: "speckit.gitlab.tasks-to-issues"
    optional: true
    prompt: "Create tasks as GitLab issues?"
    description: "Creates GitLab issues after task generation"
    condition: null

  after_implement:
    command: "speckit.gitlab.close-issues"
    optional: true
    prompt: "Close completed tasks in GitLab?"
    description: "Syncs completed tasks to GitLab after implementation"
    condition: null

tags:
  - "gitlab"
  - "issues"
  - "sync"
  - "self-hosted"

defaults:
  gitlab:
    url: ""
    project: ""
  labels:
    story_label: "user-story"
    task_label: "task"
    speckit_label: "spec-kit"
    feature_label: "feature"
  mapping:
    priority_to_label: true
    feature_to_milestone: true
    feature_to_issue: true
    link_tasks_to_stories: true
    task_issue_type: "task"
