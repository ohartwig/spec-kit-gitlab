name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  helpers:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: command -v jq || brew install jq
      - name: Run helper tests
        run: bash tests/test-helpers.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck --severity=warning -s bash scripts/bash/gitlab-helpers.sh tests/test-helpers.sh
